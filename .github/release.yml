# Groups GitHub's generated release notes by PR label.
# Complements CHANGELOG.md, which is hand-written and carries the reasoning.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels: ["breaking"]
    - title: Added
      labels: ["enhancement", "feature"]
    - title: Fixed
      labels: ["bug", "fix"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
