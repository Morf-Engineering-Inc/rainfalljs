name: Publish Package to NPM

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) and provenance

jobs:
  build:
    runs-on: ubuntu-latest
    # Declared at job level as well as workflow level. Redundant when it works,
    # and the thing that fixes it when a repo default of `read` is in play.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 bundles npm 11+, required for npm Trusted Publishing.
          node-version: '24.x'
          # NO `registry-url:` — deliberately.
          #
          # setup-node's registry-url writes an .npmrc with an auth line, and it
          # writes one EVEN WITH NO TOKEN, using a literal placeholder. The last
          # run proved it:
          #
          #     NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX
          #
          # npm then tries that fake token instead of performing the OIDC
          # exchange, publishes anonymously, and the registry answers 404 — which
          # is what npm returns for an unauthorized publish, to avoid confirming
          # a package exists. No OIDC attempt appears anywhere in the log.
          #
          # registry.npmjs.org is the default registry, so dropping this changes
          # nothing except leaving npm with no token — which is exactly the
          # condition that makes it use Trusted Publishing.
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted Publishing needs npm >= 11.5.1. Node 24 ships npm 11, but printing
      # it makes the next failure readable instead of guesswork.
      # Is an OIDC token actually available to this job? npm's Trusted Publishing
      # looks for exactly these two variables; without them it silently skips the
      # OIDC exchange and falls through to ENEEDAUTH, which is indistinguishable
      # from "no credentials configured" in the log. Four failed runs looked
      # identical because of that. Print it once and stop guessing.
      - name: OIDC availability
        run: |
          echo "npm            : $(npm --version)"
          echo "ID_TOKEN_URL   : ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-ABSENT}"
          echo "ID_TOKEN_SECRET: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-ABSENT}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::No OIDC token in this job — GitHub did not grant id-token: write. Trusted Publishing cannot work until it does."
          fi

      # A release-triggered run and a workflow_dispatch run can land on the same
      # version. 0.4.0 was published by dispatch and tagged afterwards; the
      # release event then replayed this job against a version already on the
      # registry. npm answers E403 for that, which reads like an auth failure
      # and is not one. Check first so the tag can be created at any time.
      - name: Already on the registry?
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on the registry - skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # NO `env: NODE_AUTH_TOKEN` here, deliberately.
        #
        # setup-node's `registry-url` writes an .npmrc containing
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. When the secret
        # does not exist that expands to an EMPTY token, and npm then treats auth
        # as already configured: it takes the token path, fails ENEEDAUTH, and
        # never attempts the OIDC exchange. The v0.3.0 release failed twice this
        # way, with no mention of OIDC anywhere in the log.
        #
        # So the "fallback" was not a fallback. It was the thing stopping Trusted
        # Publishing from being tried. With no token present, npm performs the
        # OIDC exchange using the `id-token: write` permission declared above.
        #
        # If a token is ever needed again, add it back as a separate step guarded
        # by `if: secrets.NPM_TOKEN != ''` rather than as an always-empty env.
        if: steps.published.outputs.skip == 'false'
        run: npm publish --access public
